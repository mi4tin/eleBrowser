<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书签管理</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            height: 60px;
            background: #4b8bff;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-icon {
            color: #4b8bff;
        }

        .header-title {
            color: white;
            font-size: 18px;
            font-weight: 500;
        }

        .search-container {
            position: relative;
            width: 400px;
        }

        .search-input {
            width: 100%;
            height: 36px;
            padding: 0 40px 0 40px;
            border: none;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            outline: none;
            transition: background 0.2s;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.3);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
        }

        /* Main Container */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: #f5f5f5;
            overflow-y: auto;
            flex-shrink: 0;
            padding: 10px 0;
        }

        .folder-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .folder-item:hover {
            background: #e8e8e8;
        }

        .folder-item.selected {
            background: #d0e5ff;
        }

        .folder-toggle {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 4px;
            font-size: 10px;
            color: #666;
        }

        .folder-toggle.expanded::before {
            content: '▼';
        }

        .folder-toggle.collapsed::before {
            content: '▶';
        }

        .folder-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .folder-name {
            flex: 1;
            font-size: 14px;
            color: #333;
        }

        .folder-children {
            margin-left: 20px;
            display: none;
        }

        .folder-item.expanded .folder-children {
            display: block;
        }

        /* Content Area */
        .content {
            flex: 1;
            background: white;
            overflow-y: auto;
            padding: 20px;
        }

        .bookmark-card {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            transition: box-shadow 0.2s, transform 0.1s;
            cursor: pointer;
        }

        .bookmark-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transform: translateY(-1px);
        }

        .bookmark-favicon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .bookmark-info {
            flex: 1;
            min-width: 0;
        }

        .bookmark-title {
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bookmark-url {
            font-size: 12px;
            color: #999;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bookmark-menu {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #999;
            font-size: 18px;
            flex-shrink: 0;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .bookmark-menu:hover {
            background: #f0f0f0;
        }

        /* Scrollbar styling */
        .sidebar::-webkit-scrollbar,
        .content::-webkit-scrollbar {
            width: 8px;
        }

        .sidebar::-webkit-scrollbar-track,
        .content::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .sidebar::-webkit-scrollbar-thumb,
        .content::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover,
        .content::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">🌐</span>
            </div>
            <div class="header-title">书签</div>
        </div>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="搜索书签" id="searchInput">
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="folder-item expanded" data-folder="life">
                <span class="folder-toggle expanded"></span>
                <span class="folder-icon">📁</span>
                <span class="folder-name">生活</span>
            </div>
            <div class="folder-item expanded" data-folder="world-news">
                <span class="folder-toggle expanded"></span>
                <span class="folder-icon">📁</span>
                <span class="folder-name">世界消息</span>
                <div class="folder-children">
                    <div class="folder-item selected" data-folder="bloomberg">
                        <span class="folder-toggle"></span>
                        <span class="folder-icon">📁</span>
                        <span class="folder-name">彭博社</span>
                    </div>
                </div>
            </div>
            <div class="folder-item" data-folder="weather">
                <span class="folder-toggle collapsed"></span>
                <span class="folder-icon">📁</span>
                <span class="folder-name">天气/气象</span>
            </div>
            <div class="folder-item" data-folder="travel">
                <span class="folder-toggle collapsed"></span>
                <span class="folder-icon">📁</span>
                <span class="folder-name">出行工具</span>
            </div>
            <div class="folder-item" data-folder="hygiene">
                <span class="folder-toggle collapsed"></span>
                <span class="folder-icon">📁</span>
                <span class="folder-name">家庭卫生</span>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content" id="content">
            <!-- Bookmark cards will be rendered here -->
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const path = require('path');

        // Sample bookmark data
        const bookmarksData = {
            'bloomberg': [
                {
                    title: '特朗普: 将于明年4月访华',
                    url: 'https://baijiahao.baidu.com/s?id=123456789',
                    favicon: '🔵'
                },
                {
                    title: '彭博社放风救市,地产股集体反弹!但底层数据藏着大信号...',
                    url: 'https://mp.weixin.qq.com/s/abcdefgh',
                    favicon: '🟢'
                }
            ],
            'life': [],
            'world-news': [],
            'weather': [],
            'travel': [],
            'hygiene': []
        };

        const sidebar = document.getElementById('sidebar');
        const content = document.getElementById('content');
        const searchInput = document.getElementById('searchInput');
        let currentFolder = 'bloomberg';

        // Initialize
        function init() {
            renderBookmarks(currentFolder);
            setupEventListeners();
        }

        // Setup event listeners
        function setupEventListeners() {
            // Folder click and toggle
            sidebar.addEventListener('click', (e) => {
                const folderItem = e.target.closest('.folder-item');
                if (!folderItem) return;

                const folderId = folderItem.dataset.folder;
                const toggle = folderItem.querySelector('.folder-toggle');

                // Toggle expand/collapse
                if (e.target === toggle || toggle.contains(e.target)) {
                    folderItem.classList.toggle('expanded');
                    toggle.classList.toggle('expanded');
                    toggle.classList.toggle('collapsed');
                    return;
                }

                // Select folder
                if (folderId) {
                    selectFolder(folderId);
                }
            });

            // Search functionality
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                if (query) {
                    searchBookmarks(query);
                } else {
                    renderBookmarks(currentFolder);
                }
            });
        }

        // Select folder
        function selectFolder(folderId) {
            currentFolder = folderId;
            
            // Update selected state
            document.querySelectorAll('.folder-item').forEach(item => {
                item.classList.remove('selected');
            });
            document.querySelector(`.folder-item[data-folder="${folderId}"]`)?.classList.add('selected');

            // Render bookmarks
            renderBookmarks(folderId);
        }

        // Render bookmarks
        function renderBookmarks(folderId) {
            const bookmarks = bookmarksData[folderId] || [];
            content.innerHTML = '';

            if (bookmarks.length === 0) {
                content.innerHTML = '<div style="text-align: center; color: #999; padding: 40px;">暂无书签</div>';
                return;
            }

            bookmarks.forEach(bookmark => {
                const card = createBookmarkCard(bookmark);
                content.appendChild(card);
            });
        }

        // Create bookmark card
        function createBookmarkCard(bookmark) {
            const card = document.createElement('div');
            card.className = 'bookmark-card';
            
            card.innerHTML = `
                <div class="bookmark-favicon">${bookmark.favicon}</div>
                <div class="bookmark-info">
                    <div class="bookmark-title">${escapeHtml(bookmark.title)}</div>
                    <div class="bookmark-url">${escapeHtml(bookmark.url)}</div>
                </div>
                <div class="bookmark-menu">⋮</div>
            `;

            // Click to open bookmark
            card.addEventListener('click', (e) => {
                if (e.target.classList.contains('bookmark-menu')) {
                    // Handle context menu
                    e.stopPropagation();
                    return;
                }
                // Prevent default link behavior
                e.preventDefault();
                e.stopPropagation();
                
                // Open bookmark in main window via IPC
                // Ensure URL has protocol
                let url = bookmark.url;
                if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                if (url) {
                    console.log('发送打开书签请求:', url);
                    ipcRenderer.send('open-bookmark', url);
                }
            });

            return card;
        }

        // Search bookmarks
        function searchBookmarks(query) {
            content.innerHTML = '';
            let found = false;

            Object.keys(bookmarksData).forEach(folderId => {
                const bookmarks = bookmarksData[folderId] || [];
                bookmarks.forEach(bookmark => {
                    if (bookmark.title.toLowerCase().includes(query) || 
                        bookmark.url.toLowerCase().includes(query)) {
                        const card = createBookmarkCard(bookmark);
                        content.appendChild(card);
                        found = true;
                    }
                });
            });

            if (!found) {
                content.innerHTML = '<div style="text-align: center; color: #999; padding: 40px;">未找到匹配的书签</div>';
            }
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
