<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书签管理</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            height: 60px;
            background: #4b8bff;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-icon {
            color: #4b8bff;
        }

        .header-title {
            color: white;
            font-size: 18px;
            font-weight: 500;
        }

        .search-container {
            position: relative;
            width: 400px;
        }

        .search-input {
            width: 100%;
            height: 36px;
            padding: 0 40px 0 40px;
            border: none;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 14px;
            outline: none;
            transition: background 0.2s;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.3);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
        }

        /* Main Container */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar - Tree Structure */
        .sidebar {
            width: 280px;
            background: #f5f5f5;
            overflow-y: auto;
            flex-shrink: 0;
            padding: 10px 0;
            border-right: 1px solid #e0e0e0;
        }

        .tree-item {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
            position: relative;
        }

        .tree-item:hover {
            background: #e8e8e8;
        }

        .tree-item.selected {
            background: #d0e5ff;
            font-weight: 500;
        }

        .tree-item-content {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .tree-indent {
            width: 20px;
            flex-shrink: 0;
        }

        .tree-toggle {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 4px;
            font-size: 10px;
            color: #666;
            flex-shrink: 0;
        }

        .tree-toggle.expanded::before {
            content: '▼';
        }

        .tree-toggle.collapsed::before {
            content: '▶';
        }

        .tree-toggle.empty::before {
            content: '';
        }

        .tree-icon {
            width: 20px;
            height: 20px;
            margin-right: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .tree-label {
            flex: 1;
            font-size: 14px;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tree-children {
            display: none;
        }

        .tree-item.expanded > .tree-children {
            display: block;
        }

        /* Content Area */
        .content {
            flex: 1;
            background: white;
            overflow-y: auto;
            padding: 20px;
        }

        .content-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .content-title {
            font-size: 18px;
            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
        }

        .content-path {
            font-size: 12px;
            color: #999;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .folder-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 120px;
        }

        .folder-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
            border-color: #4b8bff;
        }

        .folder-card-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .folder-card-name {
            font-size: 14px;
            color: #333;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        .bookmark-card {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            transition: box-shadow 0.2s, transform 0.1s;
            cursor: pointer;
        }

        .bookmark-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transform: translateY(-1px);
        }

        .bookmark-favicon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .bookmark-info {
            flex: 1;
            min-width: 0;
        }

        .bookmark-title {
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bookmark-url {
            font-size: 12px;
            color: #999;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bookmark-menu {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #999;
            font-size: 18px;
            flex-shrink: 0;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .bookmark-menu:hover {
            background: #f0f0f0;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Scrollbar styling */
        .sidebar::-webkit-scrollbar,
        .content::-webkit-scrollbar {
            width: 8px;
        }

        .sidebar::-webkit-scrollbar-track,
        .content::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .sidebar::-webkit-scrollbar-thumb,
        .content::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover,
        .content::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">🌐</span>
            </div>
            <div class="header-title">书签</div>
        </div>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="搜索书签" id="searchInput">
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar - Tree Structure -->
        <div class="sidebar" id="sidebar"></div>

        <!-- Content Area -->
        <div class="content" id="content">
            <div class="content-header">
                <div class="content-title" id="contentTitle">书签</div>
                <div class="content-path" id="contentPath">/</div>
            </div>
            <div class="content-grid" id="contentGrid"></div>
        </div>
    </div>

    <script>
        // 安全地获取 electron API
        let ipcRenderer;
        try {
            const electron = require('electron');
            ipcRenderer = electron.ipcRenderer;
        } catch (e) {
            console.error('无法加载 electron 模块:', e);
            ipcRenderer = {
                send: function(channel, data) {
                    console.log('IPC send (模拟):', channel, data);
                }
            };
        }

        // 书签数据结构 - 支持嵌套文件夹
        const bookmarksTree = {
            id: 'root',
            name: '书签',
            type: 'folder',
            children: [
                {
                    id: 'life',
                    name: '生活',
                    type: 'folder',
                    children: [
                        {
                            id: 'life-food',
                            name: '美食',
                            type: 'folder',
                            children: [],
                            bookmarks: []
                        },
                        {
                            id: 'life-shopping',
                            name: '购物',
                            type: 'folder',
                            children: [],
                            bookmarks: [
                                {
                                    title: '淘宝',
                                    url: 'https://www.taobao.com',
                                    favicon: '🛒'
                                }
                            ]
                        }
                    ],
                    bookmarks: []
                },
                {
                    id: 'world-news',
                    name: '世界消息',
                    type: 'folder',
                    children: [
                        {
                            id: 'bloomberg',
                            name: '彭博社',
                            type: 'folder',
                            children: [],
                            bookmarks: [
                                {
                                    title: '特朗普: 将于明年4月访华',
                                    url: 'https://baijiahao.baidu.com/s?id=123456789',
                                    favicon: '🔵'
                                },
                                {
                                    title: '彭博社放风救市,地产股集体反弹!但底层数据藏着大信号...',
                                    url: 'https://mp.weixin.qq.com/s/abcdefgh',
                                    favicon: '🟢'
                                }
                            ]
                        },
                        {
                            id: 'reuters',
                            name: '路透社',
                            type: 'folder',
                            children: [],
                            bookmarks: []
                        }
                    ],
                    bookmarks: []
                },
                {
                    id: 'weather',
                    name: '天气/气象',
                    type: 'folder',
                    children: [],
                    bookmarks: [
                        {
                            title: '中国天气网',
                            url: 'https://www.weather.com.cn',
                            favicon: '☁️'
                        }
                    ]
                },
                {
                    id: 'travel',
                    name: '出行工具',
                    type: 'folder',
                    children: [],
                    bookmarks: []
                },
                {
                    id: 'hygiene',
                    name: '家庭卫生',
                    type: 'folder',
                    children: [],
                    bookmarks: []
                }
            ],
            bookmarks: []
        };

        const sidebar = document.getElementById('sidebar');
        const content = document.getElementById('content');
        const contentTitle = document.getElementById('contentTitle');
        const contentPath = document.getElementById('contentPath');
        const contentGrid = document.getElementById('contentGrid');
        const searchInput = document.getElementById('searchInput');
        
        let currentFolder = bookmarksTree;
        let expandedFolders = new Set(['root']); // 默认展开根目录

        // 初始化
        function init() {
            renderTree();
            renderContent(currentFolder);
            setupEventListeners();
        }

        // 设置事件监听
        function setupEventListeners() {
            // 搜索功能
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                if (query) {
                    searchBookmarks(query);
                } else {
                    renderContent(currentFolder);
                }
            });
        }

        // 渲染树形结构
        function renderTree() {
            sidebar.innerHTML = '';
            renderTreeItem(bookmarksTree, 0);
        }

        // 递归渲染树形项
        function renderTreeItem(item, level) {
            const hasChildren = item.children && item.children.length > 0;
            const isExpanded = expandedFolders.has(item.id);
            
            const treeItem = document.createElement('div');
            treeItem.className = 'tree-item';
            if (currentFolder.id === item.id) {
                treeItem.classList.add('selected');
            }
            if (isExpanded && hasChildren) {
                treeItem.classList.add('expanded');
            }
            treeItem.dataset.id = item.id;

            const indent = level * 20;
            treeItem.innerHTML = `
                <div class="tree-item-content" style="padding-left: ${indent}px;">
                    <span class="tree-toggle ${hasChildren ? (isExpanded ? 'expanded' : 'collapsed') : 'empty'}"></span>
                    <span class="tree-icon">📁</span>
                    <span class="tree-label">${escapeHtml(item.name)}</span>
                </div>
                ${hasChildren ? `<div class="tree-children"></div>` : ''}
            `;

            // 添加点击事件
            const contentEl = treeItem.querySelector('.tree-item-content');
            contentEl.addEventListener('click', (e) => {
                e.stopPropagation();
                selectFolder(item);
            });

            // 添加展开/折叠事件
            const toggleEl = treeItem.querySelector('.tree-toggle');
            if (hasChildren) {
                toggleEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFolder(item.id);
                });
            }

            sidebar.appendChild(treeItem);

            // 递归渲染子项
            if (hasChildren && isExpanded) {
                const childrenContainer = treeItem.querySelector('.tree-children');
                item.children.forEach(child => {
                    renderTreeItem(child, level + 1);
                });
            }
        }

        // 切换文件夹展开/折叠
        function toggleFolder(folderId) {
            if (expandedFolders.has(folderId)) {
                expandedFolders.delete(folderId);
            } else {
                expandedFolders.add(folderId);
            }
            renderTree();
        }

        // 选择文件夹
        function selectFolder(folder) {
            currentFolder = folder;
            renderTree();
            renderContent(folder);
        }

        // 渲染内容区域
        function renderContent(folder) {
            contentTitle.textContent = folder.name;
            contentPath.textContent = getFolderPath(folder);
            
            contentGrid.innerHTML = '';
            
            const hasSubFolders = folder.children && folder.children.length > 0;
            const hasBookmarks = folder.bookmarks && folder.bookmarks.length > 0;

            if (!hasSubFolders && !hasBookmarks) {
                contentGrid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">📂</div>
                        <div>此文件夹为空</div>
                    </div>
                `;
                return;
            }

            // 渲染子文件夹
            if (hasSubFolders) {
                folder.children.forEach(subFolder => {
                    const folderCard = createFolderCard(subFolder);
                    contentGrid.appendChild(folderCard);
                });
            }

            // 渲染书签
            if (hasBookmarks) {
                folder.bookmarks.forEach(bookmark => {
                    const bookmarkCard = createBookmarkCard(bookmark);
                    contentGrid.appendChild(bookmarkCard);
                });
            }
        }

        // 创建文件夹卡片
        function createFolderCard(folder) {
            const card = document.createElement('div');
            card.className = 'folder-card';
            
            const bookmarkCount = (folder.bookmarks && folder.bookmarks.length) || 0;
            const subFolderCount = (folder.children && folder.children.length) || 0;
            const totalCount = bookmarkCount + subFolderCount;

            card.innerHTML = `
                <div class="folder-card-icon">📁</div>
                <div class="folder-card-name">${escapeHtml(folder.name)}</div>
                <div style="font-size: 12px; color: #999; margin-top: 4px;">${totalCount} 项</div>
            `;

            card.addEventListener('click', () => {
                selectFolder(folder);
            });

            return card;
        }

        // 创建书签卡片
        function createBookmarkCard(bookmark) {
            const card = document.createElement('div');
            card.className = 'bookmark-card';
            
            card.innerHTML = `
                <div class="bookmark-favicon">${bookmark.favicon || '🔗'}</div>
                <div class="bookmark-info">
                    <div class="bookmark-title">${escapeHtml(bookmark.title)}</div>
                    <div class="bookmark-url">${escapeHtml(bookmark.url)}</div>
                </div>
                <div class="bookmark-menu">⋮</div>
            `;

            card.addEventListener('click', (e) => {
                if (e.target.classList.contains('bookmark-menu')) {
                    e.stopPropagation();
                    return;
                }
                e.preventDefault();
                e.stopPropagation();
                
                let url = bookmark.url;
                if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                if (url) {
                    ipcRenderer.send('open-bookmark', url);
                }
            });

            return card;
        }

        // 获取文件夹路径
        function getFolderPath(folder) {
            const path = [];
            let current = folder;
            
            // 向上查找路径
            function findPath(node, targetId) {
                if (node.id === targetId) {
                    path.unshift(node.name);
                    return true;
                }
                if (node.children) {
                    for (const child of node.children) {
                        if (findPath(child, targetId)) {
                            path.unshift(node.name);
                            return true;
                        }
                    }
                }
                return false;
            }
            
            findPath(bookmarksTree, folder.id);
            return '/' + path.join('/');
        }

        // 搜索书签
        function searchBookmarks(query) {
            contentTitle.textContent = `搜索结果: "${query}"`;
            contentPath.textContent = '';
            contentGrid.innerHTML = '';
            
            const results = [];
            function searchInFolder(folder) {
                // 搜索书签
                if (folder.bookmarks) {
                    folder.bookmarks.forEach(bookmark => {
                        if (bookmark.title.toLowerCase().includes(query) || 
                            bookmark.url.toLowerCase().includes(query)) {
                            results.push(bookmark);
                        }
                    });
                }
                // 递归搜索子文件夹
                if (folder.children) {
                    folder.children.forEach(child => {
                        searchInFolder(child);
                    });
                }
            }
            
            searchInFolder(bookmarksTree);
            
            if (results.length === 0) {
                contentGrid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">🔍</div>
                        <div>未找到匹配的书签</div>
                    </div>
                `;
            } else {
                results.forEach(bookmark => {
                    const card = createBookmarkCard(bookmark);
                    contentGrid.appendChild(card);
                });
            }
        }

        // 转义 HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 初始化
        init();
    </script>
</body>
</html>
