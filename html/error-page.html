<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无法访问此网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .error-container {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
        .error-icon {
            width: 120px;
            height: 120px;
            background-color: #4285f4;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 60px;
            color: white;
            font-weight: bold;
        }
        .error-title {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 16px;
            color: #202124;
        }
        .error-subtitle {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 30px;
        }
        .error-details {
            background-color: white;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }
        .error-details p {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 8px;
        }
        .error-code {
            font-family: monospace;
            color: #d93025;
        }
        .reload-btn {
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .reload-btn:hover {
            background-color: #3367d6;
        }
        .reload-btn:active {
            background-color: #2c56b4;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <span>😢</span>
        </div>
        <h1 class="error-title">无法访问此网站</h1>
        <p class="error-subtitle" id="url-check">检查 URL 中是否有拼写错误。</p>
        <div class="error-details">
            <p>如果拼写无误，请尝试运行 Windows 网络诊断。</p>
            <p class="error-code" id="error-description">错误描述</p>
        </div>
        <button class="reload-btn" id="reload-btn">重新加载</button>
    </div>

    <script>
        // 从 URL 参数中获取错误信息
        const urlParams = new URLSearchParams(window.location.search);
        const validatedURL = urlParams.get('url') || '未知网址';
        const errorDescription = urlParams.get('error') || '未知错误';

        // 更新页面内容
        document.getElementById('url-check').textContent = `检查 ${validatedURL} 中是否有拼写错误。`;
        document.getElementById('error-description').textContent = errorDescription;

        // 重新加载按钮事件
        document.getElementById('reload-btn').addEventListener('click', () => {
            window.location.href = validatedURL;
        });
    </script>
</body>
</html>
