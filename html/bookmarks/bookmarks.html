<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书签管理</title>
    <link rel="stylesheet" href="bookmarks.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">🌐</span>
            </div>
            <div class="header-title">书签</div>
        </div>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="搜索书签" id="searchInput">
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar - Tree Structure -->
        <div class="sidebar" id="sidebar"></div>

        <!-- Content Area -->
        <div class="content" id="content">
            <div class="content-header">
                <div class="content-title" id="contentTitle">书签</div>
                <div class="content-path" id="contentPath">/</div>
            </div>
            <div class="content-grid" id="contentGrid"></div>
        </div>
    </div>
    
    <script src="../../common/toolkit.js"></script>
    <script src="bookmark-sync.js"></script>
    <script src="bookmarks.js"></script>
</body>
</html>
