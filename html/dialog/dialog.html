<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>应用内的提示</title>
    <link rel="stylesheet" href="./dialog.css" />
</head>
<body>
    <div class="dialog-card">
        <div class="dialog-content" id="dialog-content">
            <div class="dialog-message dialog-title" id="dialog-title"></div>
            <div class="dialog-message" id="dialog-message"></div>
            <div class="dialog-save-user-pwd" id="dialog-save-user-pwd">
                <div class="save-pwd-field">
                    <label class="save-pwd-label">用户名</label>
                    <input type="text" class="save-pwd-input" id="save-pwd-username" autocomplete="off">
                </div>
                <div class="save-pwd-field">
                    <label class="save-pwd-label">密码</label>
                    <div class="save-pwd-password-wrapper">
                        <input type="password" class="save-pwd-input" id="save-pwd-password">
                        <button type="button" class="save-pwd-toggle" id="save-pwd-toggle"></button>
                    </div>
                </div>
            </div>
        </div>
        <div class="dialog-footer" id="dialog-footer"></div>
    </div>
    <script src="./dialog.js"></script>
</body>
</html>
