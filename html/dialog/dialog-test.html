<!-- Ctrl+Shift+D 打开对话框测试页面 -->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>对话框测试页面</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin-bottom: 30px;
            color: #333;
            font-size: 28px;
        }
        .section {
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #4b8bff;
        }
        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            background: #4b8bff;
            color: white;
        }
        button:hover {
            background: #3a7ae8;
        }
        button:active {
            background: #2d6cdf;
        }
        button.secondary {
            background: #f0f0f0;
            color: #333;
        }
        button.secondary:hover {
            background: #e5e5e5;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            font-family: monospace;
            font-size: 13px;
            display: none;
        }
        .result.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>对话框测试页面</h1>

        <div class="section">
            <div class="section-title">1. 简单提示弹窗</div>
            <div class="button-group">
                <button onclick="testSimpleDialog()">简单提示</button>
                <button onclick="testSimpleDialogWithCustomText()">自定义确认文本</button>
            </div>
            <div class="result" id="result-simple"></div>
        </div>

        <div class="section">
            <div class="section-title">2. 确认弹窗</div>
            <div class="button-group">
                <button onclick="testConfirmDialog()">确认删除</button>
                <button onclick="testConfirmDialogCustom()">自定义确认/取消</button>
            </div>
            <div class="result" id="result-confirm"></div>
        </div>

        <div class="section">
            <div class="section-title">3. 保存密码弹窗</div>
            <div class="button-group">
                <button onclick="testSavePasswordDialog()">保存密码</button>
                <button onclick="testSavePasswordDialogWithCustom()">自定义保存密码</button>
            </div>
            <div class="result" id="result-save"></div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        function showResult(elementId, result) {
            const resultEl = document.getElementById(elementId);
            resultEl.textContent = JSON.stringify(result, null, 2);
            resultEl.classList.add('show');
        }

        // 1. 简单提示弹窗
        async function testSimpleDialog() {
            const result = await ipcRenderer.invoke('show-dialog', {
                title: '提示',
                message: '这是一条简单的提示消息',
                confirmText: '好的'
            });
            showResult('result-simple', result);
        }

        async function testSimpleDialogWithCustomText() {
            const result = await ipcRenderer.invoke('show-dialog', {
                title: '操作成功',
                message: '您的设置已保存成功！',
                confirmText: '知道了'
            });
            showResult('result-simple', result);
        }

        // 2. 确认弹窗
        async function testConfirmDialog() {
            const result = await ipcRenderer.invoke('show-dialog', {
                title: '确认删除',
                message: '确定要删除这个文件吗？此操作不可恢复。',
                confirmText: '删除',
                cancelText: '取消'
            });
            showResult('result-confirm', { clicked: result ? '确认' : '取消' });
        }

        async function testConfirmDialogCustom() {
            const result = await ipcRenderer.invoke('show-dialog', {
                title: '确认退出',
                message: '确定要退出应用吗？',
                confirmText: '退出',
                cancelText: '继续'
            });
            showResult('result-confirm', { clicked: result ? '退出' : '继续' });
        }

        // 3. 保存密码弹窗
        async function testSavePasswordDialog() {
            const result = await ipcRenderer.invoke('show-save-password-dialog', {
                title: '要保存密码吗？',
                message: '',
                confirmText: '保存',
                cancelText: '一律不',
                username: 'testuser@example.com',
                password: 'testpassword123'
            });
            showResult('result-save', result);
        }

        async function testSavePasswordDialogWithCustom() {
            const result = await ipcRenderer.invoke('show-save-password-dialog', {
                title: '保存登录信息',
                message: '下次登录时可以自动填充',
                confirmText: '保存密码',
                cancelText: '永不保存',
                username: 'admin',
                password: 'mypassword'
            });
            showResult('result-save', result);
        }
    </script>
</body>
</html>
