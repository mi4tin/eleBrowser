<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>安全警告</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: #fff1f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon svg {
            width: 40px;
            height: 40px;
            fill: #ff4d4f;
        }
        h1 {
            color: #262626;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .description {
            color: #595959;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .url-box {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
            color: #262626;
        }
        .error-info {
            background: #fff7e6;
            border: 1px solid #ffd591;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            text-align: left;
        }
        .error-info h3 {
            color: #d46b08;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .error-info p {
            color: #874210;
            font-size: 13px;
            margin: 4px 0;
        }
        .advanced-details {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
            display: none;
        }
        .advanced-details h4 {
            color: #495057;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .advanced-details p {
            color: #6c757d;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 8px;
        }
        .clock-info {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
        }
        .clock-info p {
            color: #0066cc;
            font-size: 12px;
            margin: 0;
        }
        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            min-width: 120px;
        }
        .btn-back {
            background: #f5f5f5;
            color: #595959;
        }
        .btn-back:hover {
            background: #e8e8e8;
        }
        .btn-advanced {
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }
        .btn-advanced:hover {
            background: #bae7ff;
        }
        .btn-danger {
            background: #ff4d4f;
            color: white;
        }
        .btn-danger:hover {
            background: #ff7875;
        }
        .btn-danger:active {
            background: #cf1322;
        }
        .btn-continue {
            background: #52c41a;
            color: white;
            display: none;
        }
        .btn-continue:hover {
            background: #73d13d;
        }
        .btn-continue:active {
            background: #389e0d;
        }
        .advanced-visible .advanced-details {
            display: block;
        }
        .advanced-visible .btn-advanced {
            display: none;
        }
        .advanced-visible .btn-continue {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <h1>您的连接不是私密连接</h1>
        <p class="description" id="description">
            攻击者可能会试图从 <strong id="hostname">example.com</strong> 窃取您的信息（例如密码、通讯内容或信用卡信息）。
        </p>
        <div class="url-box" id="url-display">https://example.com</div>
        <div class="error-info">
            <h3>证书错误详情</h3>
            <p id="error-message">证书已过期或尚未生效</p>
        </div>
        
        <div class="advanced-details" id="advanced-details">
            <h4 id="advanced-title">此网站的安全证书存在问题</h4>
            <p id="detailed-error"></p>
            <p id="advanced-reason" class="advanced-reason"></p>
            <div class="clock-info" id="clock-info">
                <p>计算机的时钟目前已设为 <span id="current-date">2026年3月6日星期五</span>，请问是否正确？如果不正确，请更正系统的时钟，然后刷新此页面。</p>
            </div>
            <p id="advanced-extra" class="advanced-extra"></p>
        </div>
        
        <div class="buttons">
            <button class="btn-back" onclick="history.back()">返回</button>
            <button class="btn-advanced" onclick="showAdvancedDetails()">高级</button>
            <button class="btn-continue" onclick="continueToSite()">继续访问</button>
            <button class="btn-danger" onclick="closePage()">关闭页面</button>
        </div>
    </div>

    <script>
        // 从URL参数获取错误信息
        const urlParams = new URLSearchParams(window.location.search);
        const hostname = urlParams.get('hostname') || '未知网站';
        const url = urlParams.get('url') || 'https://example.com';
        const error = urlParams.get('error') || '未知错误';

        // 更新页面内容
        document.getElementById('hostname').textContent = hostname;
        document.getElementById('url-display').textContent = url;
        document.getElementById('error-message').textContent = getCertificateErrorMessage(error);
        
        // 根据错误类型动态渲染高级详情（标题、详情、原因、时钟提示、额外说明）
        renderAdvancedDetails(hostname, error);
        
        // 更新当前日期（用于证书日期类错误的时钟提示）
        const currentDate = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('current-date').textContent = currentDate.toLocaleDateString('zh-CN', options);

        // 显示高级详情
        function showAdvancedDetails() {
            document.body.classList.add('advanced-visible');
        }

        // 继续访问网站
        function continueToSite() {
            // 通过Electron的API告诉主进程继续访问
            if (window.electronAPI) {
                window.electronAPI.send('ssl-continue-access', url);
            } else {
                // 如果无法使用Electron API，尝试直接重定向
                console.log('无法使用Electron API，尝试直接重定向到:', url);
                window.location.href = url;
            }
        }

        // 关闭页面
        function closePage() {
            window.location.href = 'about:blank';
        }

        // 错误消息映射函数
        function getCertificateErrorMessage(error) {
            const errorMessages = {
                'net::ERR_CERT_DATE_INVALID': '证书已过期或尚未生效',
                'net::ERR_CERT_COMMON_NAME_INVALID': '证书域名不匹配',
                'net::ERR_CERT_AUTHORITY_INVALID': '证书颁发机构不可信',
                'net::ERR_CERT_REVOKED': '证书已被吊销',
                'net::ERR_CERT_INVALID': '证书无效',
                'net::ERR_SSL_PROTOCOL_ERROR': 'SSL协议错误',
                'net::ERR_CONNECTION_CLOSED': '连接已关闭',
                'net::ERR_CONNECTION_RESET': '连接被重置',
                'net::ERR_CONNECTION_REFUSED': '连接被拒绝',
                'net::ERR_NAME_NOT_RESOLVED': '无法解析域名',
                'net::ERR_INTERNET_DISCONNECTED': '网络已断开',
                'net::ERR_NETWORK_IO_SUSPENDED': '网络IO已暂停',
                'net::ERR_SSL_PINNED_KEY_NOT_IN_CERT_CHAIN': 'SSL固定密钥不在证书链中',
                'net::ERR_SSL_CLIENT_AUTH_CERT_NEEDED': '需要客户端证书',
                'net::ERR_TUNNEL_CONNECTION_FAILED': '隧道连接失败',
                'net::ERR_CERT_WEAK_SIGNATURE_ALGORITHM': '证书签名算法太弱',
                'net::ERR_CERT_SYMantec_LEGACY': '证书由Symantec颁发（已不被信任）',
                'net::ERR_CERT_KNOWN_INTERCEPTION_BLOCKED': '证书被已知拦截器阻止'
            };
            return errorMessages[error] || error || '未知错误';
        }

        // 生成详细错误描述（简短版，用于兼容）
        function generateDetailedError(hostname, error) {
            const c = advancedDetailsConfig[error];
            return c ? c.detail : `此服务器 ${hostname} 存在安全证书问题：${getCertificateErrorMessage(error)}。`;
        }

        // 按错误类型配置：标题、详情、原因说明、是否显示时钟提示、额外说明
        const advancedDetailsConfig = {
            'net::ERR_CERT_DATE_INVALID': {
                title: '证书日期无效',
                detail: `此服务器无法证明其所在网域是 ${hostname}；其安全证书已过期或尚未生效。`,
                reason: '出现此问题的原因可能是：服务器证书已过期或未到生效时间，或您的计算机时钟不正确。',
                showClock: true,
                extra: '建议先核对本机日期与时间；若正确，则需网站管理员续期或更换证书。'
            },
            'net::ERR_CERT_COMMON_NAME_INVALID': {
                title: '证书域名不匹配',
                detail: `此服务器提供的安全证书所声明的域名与您访问的 ${hostname} 不一致。`,
                reason: '可能原因：该站点使用了为其他域名签发的证书，或存在中间人篡改/劫持。',
                showClock: false,
                extra: '请确认地址栏中的域名是否正确；若为合法站点，需管理员为当前域名重新申请证书。'
            },
            'net::ERR_CERT_AUTHORITY_INVALID': {
                title: '证书颁发机构不可信',
                detail: `此服务器使用的安全证书不是由受信任的证书颁发机构（CA）签发的。`,
                reason: '常见于自签名证书或企业内部 CA 未加入本机信任列表。',
                showClock: false,
                extra: '若为自建或内网站点，可尝试将对应根证书加入系统信任；否则存在安全风险。'
            },
            'net::ERR_CERT_REVOKED': {
                title: '证书已被吊销',
                detail: `此服务器为 ${hostname} 提供的安全证书已被颁发机构吊销，不再视为有效。`,
                reason: '证书可能因私钥泄露、域名变更或违规等原因被 CA 撤销。',
                showClock: false,
                extra: '请勿在此站点输入敏感信息；网站需重新申请并部署新证书。'
            },
            'net::ERR_CERT_INVALID': {
                title: '证书无效',
                detail: `此服务器为 ${hostname} 提供的安全证书格式或内容无效，无法通过验证。`,
                reason: '可能由证书损坏、被篡改或不符合规范导致。',
                showClock: false,
                extra: ''
            },
            'net::ERR_SSL_PROTOCOL_ERROR': {
                title: 'SSL/TLS 协议错误',
                detail: `与 ${hostname} 建立安全连接时发生协议层面的错误。`,
                reason: '可能原因：服务器 SSL/TLS 配置错误、版本不兼容或连接被中断。',
                showClock: false,
                extra: '建议稍后重试；若持续出现，需服务器端检查 HTTPS 配置。'
            },
            'net::ERR_CONNECTION_CLOSED': {
                title: '连接已关闭',
                detail: `与 ${hostname} 的安全连接在完成前被关闭。`,
                reason: '可能由服务器主动断开、网络不稳定或防火墙/代理干预导致。',
                showClock: false,
                extra: ''
            },
            'net::ERR_CONNECTION_RESET': {
                title: '连接被重置',
                detail: `与 ${hostname} 的连接在传输过程中被重置。`,
                reason: '常见于网络中断、服务器重启或安全设备拦截。',
                showClock: false,
                extra: ''
            },
            'net::ERR_CONNECTION_REFUSED': {
                title: '连接被拒绝',
                detail: `无法连接到 ${hostname}，对方未接受连接。`,
                reason: '可能原因：服务未启动、端口未开放或防火墙阻止。',
                showClock: false,
                extra: ''
            },
            'net::ERR_NAME_NOT_RESOLVED': {
                title: '无法解析域名',
                detail: `无法解析 ${hostname} 的域名，无法确定服务器地址。`,
                reason: '可能原因：域名拼写错误、DNS 故障或本地网络无法访问 DNS。',
                showClock: false,
                extra: '请检查网址是否正确，并确认网络与 DNS 设置正常。'
            },
            'net::ERR_SSL_PINNED_KEY_NOT_IN_CERT_CHAIN': {
                title: '证书与固定公钥不匹配',
                detail: '服务器返回的证书链中不包含应用所固定的公钥。',
                reason: '通常用于防范中间人攻击；证书或服务器配置可能已变更。',
                showClock: false,
                extra: ''
            },
            'net::ERR_CERT_WEAK_SIGNATURE_ALGORITHM': {
                title: '证书签名算法过弱',
                detail: `此服务器为 ${hostname} 使用的证书采用了不再受信任的弱签名算法。`,
                reason: '为安全考虑，现代浏览器已禁用部分旧算法（如 SHA-1）。',
                showClock: false,
                extra: '需网站管理员使用更强算法重新签发证书。'
            },
            'net::ERR_CERT_KNOWN_INTERCEPTION_BLOCKED': {
                title: '检测到证书拦截',
                detail: '当前连接使用的证书被识别为已知的拦截/代理证书，已被阻止。',
                reason: '部分企业代理或安全软件会替换证书以检查流量，可能触发此提示。',
                showClock: false,
                extra: '若处于企业或学校网络，请联系管理员；否则可能存在中间人风险。'
            },
            'net::ERR_INTERNET_DISCONNECTED': {
                title: '网络已断开',
                detail: '当前无法访问互联网，请检查网络连接。',
                reason: '可能原因：未连接 WiFi/有线网络、飞行模式已开启或运营商网络故障。',
                showClock: false,
                extra: '请检查本机网络设置与路由器连接后重试。'
            },
            'net::ERR_NETWORK_IO_SUSPENDED': {
                title: '网络 IO 已暂停',
                detail: '系统已暂停网络访问（例如省电或休眠恢复中），导致请求无法完成。',
                reason: '常见于设备休眠唤醒后或系统节电策略限制网络时。',
                showClock: false,
                extra: '请稍后重试或检查系统电源与网络策略。'
            },
            'net::ERR_SSL_CLIENT_AUTH_CERT_NEEDED': {
                title: '需要客户端证书',
                detail: `服务器 ${hostname} 要求提供客户端证书以完成身份验证。`,
                reason: '该站点启用了双向 TLS 认证，需在系统或浏览器中安装并选择有效客户端证书。',
                showClock: false,
                extra: '若为内网或企业站点，请向管理员申请并安装客户端证书。'
            },
            'net::ERR_TUNNEL_CONNECTION_FAILED': {
                title: '隧道连接失败',
                detail: '建立 HTTPS 代理隧道时失败，无法通过代理访问目标服务器。',
                reason: '可能原因：代理服务器不可用、代理拒绝连接或代理的 SSL 校验失败。',
                showClock: false,
                extra: '请检查代理设置与代理服务状态。'
            },
            'net::ERR_CERT_SYMantec_LEGACY': {
                title: 'Symantec 旧证书不受信任',
                detail: `此服务器为 ${hostname} 使用的证书由 Symantec 旧根签发，已被主流信任库移除。`,
                reason: '因历史合规问题，由 Symantec 旧根签发的证书不再被信任。',
                showClock: false,
                extra: '需网站管理员向其他 CA 重新申请并部署证书。'
            }
        };

        function renderAdvancedDetails(hostname, error) {
            const elTitle = document.getElementById('advanced-title');
            const elDetail = document.getElementById('detailed-error');
            const elReason = document.getElementById('advanced-reason');
            const elClock = document.getElementById('clock-info');
            const elExtra = document.getElementById('advanced-extra');
            const set = (el, content, display) => {
                if (el) {
                    if (content !== undefined) el.textContent = content;
                    if (display !== undefined) el.style.display = display;
                }
            };

            const c = advancedDetailsConfig[error];
            if (c) {
                set(elTitle, c.title);
                set(elDetail, c.detail);
                set(elReason, c.reason || '', c.reason ? '' : 'none');
                set(elClock, undefined, c.showClock ? '' : 'none');
                set(elExtra, c.extra || '', c.extra ? '' : 'none');
            } else {
                set(elTitle, '此网站的安全证书存在问题');
                set(elDetail, `此服务器 ${hostname} 存在安全证书问题：${getCertificateErrorMessage(error)}。`);
                set(elReason, '出现此问题的原因可能是配置有误，或是有攻击者拦截您的连接。', '');
                set(elClock, undefined, 'none');
                set(elExtra, '', 'none');
            }
        }
    </script>
</body>
</html>
