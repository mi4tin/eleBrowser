<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>安全警告</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: #fff1f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon svg {
            width: 40px;
            height: 40px;
            fill: #ff4d4f;
        }
        h1 {
            color: #262626;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .description {
            color: #595959;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .url-box {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
            color: #262626;
        }
        .error-info {
            background: #fff7e6;
            border: 1px solid #ffd591;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            text-align: left;
        }
        .error-info h3 {
            color: #d46b08;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .error-info p {
            color: #874210;
            font-size: 13px;
            margin: 4px 0;
        }
        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-back {
            background: #f5f5f5;
            color: #595959;
        }
        .btn-back:hover {
            background: #e8e8e8;
        }
        .btn-danger {
            background: #ff4d4f;
            color: white;
        }
        .btn-danger:hover {
            background: #ff7875;
        }
        .btn-danger:active {
            background: #cf1322;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <h1>您的连接不是私密连接</h1>
        <p class="description" id="description">
            攻击者可能会试图从 <strong id="hostname">example.com</strong> 窃取您的信息（例如密码、通讯内容或信用卡信息）。
        </p>
        <div class="url-box" id="url-display">https://example.com</div>
        <div class="error-info">
            <h3>证书错误详情</h3>
            <p id="error-message">证书已过期或尚未生效</p>
        </div>
        <div class="buttons">
            <button class="btn-back" onclick="history.back()">返回</button>
            <button class="btn-danger" onclick="location.href='about:blank'">关闭页面</button>
        </div>
    </div>

    <script>
        // 从URL参数获取错误信息
        const urlParams = new URLSearchParams(window.location.search);
        const hostname = urlParams.get('hostname') || '未知网站';
        const url = urlParams.get('url') || 'https://example.com';
        const error = urlParams.get('error') || '未知错误';

        // 更新页面内容
        document.getElementById('hostname').textContent = hostname;
        document.getElementById('url-display').textContent = url;
        document.getElementById('error-message').textContent = getCertificateErrorMessage(error);

        // 错误消息映射函数
        function getCertificateErrorMessage(error) {
            const errorMessages = {
                'net::ERR_CERT_DATE_INVALID': '证书已过期或尚未生效',
                'net::ERR_CERT_COMMON_NAME_INVALID': '证书域名不匹配',
                'net::ERR_CERT_AUTHORITY_INVALID': '证书颁发机构不可信',
                'net::ERR_CERT_REVOKED': '证书已被吊销',
                'net::ERR_CERT_INVALID': '证书无效',
                'net::ERR_SSL_PROTOCOL_ERROR': 'SSL协议错误',
                'net::ERR_CONNECTION_CLOSED': '连接已关闭',
                'net::ERR_CONNECTION_RESET': '连接被重置',
                'net::ERR_CONNECTION_REFUSED': '连接被拒绝',
                'net::ERR_NAME_NOT_RESOLVED': '无法解析域名',
                'net::ERR_INTERNET_DISCONNECTED': '网络已断开',
                'net::ERR_NETWORK_IO_SUSPENDED': '网络IO已暂停',
                'net::ERR_SSL_PINNED_KEY_NOT_IN_CERT_CHAIN': 'SSL固定密钥不在证书链中',
                'net::ERR_SSL_CLIENT_AUTH_CERT_NEEDED': '需要客户端证书',
                'net::ERR_TUNNEL_CONNECTION_FAILED': '隧道连接失败',
                'net::ERR_CERT_WEAK_SIGNATURE_ALGORITHM': '证书签名算法太弱',
                'net::ERR_CERT_SYMantec_LEGACY': '证书由Symantec颁发（已不被信任）',
                'net::ERR_CERT_KNOWN_INTERCEPTION_BLOCKED': '证书被已知拦截器阻止'
            };
            return errorMessages[error] || error || '未知错误';
        }
    </script>
</body>
</html>
