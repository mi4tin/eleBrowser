<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>安全警告</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: #fff1f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon svg {
            width: 40px;
            height: 40px;
            fill: #ff4d4f;
        }
        h1 {
            color: #262626;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .description {
            color: #595959;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .url-box {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
            color: #262626;
        }
        .error-info {
            background: #fff7e6;
            border: 1px solid #ffd591;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 24px;
            text-align: left;
        }
        .error-info h3 {
            color: #d46b08;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .error-info p {
            color: #874210;
            font-size: 13px;
            margin: 4px 0;
        }
        .advanced-details {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
            display: none;
        }
        .advanced-details h4 {
            color: #495057;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .advanced-details p {
            color: #6c757d;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 8px;
        }
        .clock-info {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
        }
        .clock-info p {
            color: #0066cc;
            font-size: 12px;
            margin: 0;
        }
        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            min-width: 120px;
        }
        .btn-back {
            background: #f5f5f5;
            color: #595959;
        }
        .btn-back:hover {
            background: #e8e8e8;
        }
        .btn-advanced {
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }
        .btn-advanced:hover {
            background: #bae7ff;
        }
        .btn-danger {
            background: #ff4d4f;
            color: white;
        }
        .btn-danger:hover {
            background: #ff7875;
        }
        .btn-danger:active {
            background: #cf1322;
        }
        .btn-continue {
            background: #52c41a;
            color: white;
            display: none;
        }
        .btn-continue:hover {
            background: #73d13d;
        }
        .btn-continue:active {
            background: #389e0d;
        }
        .advanced-visible .advanced-details {
            display: block;
        }
        .advanced-visible .btn-advanced {
            display: none;
        }
        .advanced-visible .btn-continue {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <h1>您的连接不是私密连接</h1>
        <p class="description" id="description">
            攻击者可能会试图从 <strong id="hostname">example.com</strong> 窃取您的信息（例如密码、通讯内容或信用卡信息）。
        </p>
        <div class="url-box" id="url-display">https://example.com</div>
        <div class="error-info">
            <h3>证书错误详情</h3>
            <p id="error-message">证书已过期或尚未生效</p>
        </div>
        
        <div class="advanced-details" id="advanced-details">
            <h4>此网站的安全证书存在问题</h4>
            <p id="detailed-error">此服务器无法证明其所在网域是 example.com；其安全证书已在 82 天前过期。</p>
            <p>出现此问题的原因可能是配置有误，或是有攻击者拦截您的连接。</p>
            <div class="clock-info">
                <p>计算机的时钟目前已设为 <span id="current-date">2026年3月6日星期五</span>，请问是否正确？如果不正确，请更正系统的时钟，然后刷新此页面。</p>
            </div>
        </div>
        
        <div class="buttons">
            <button class="btn-back" onclick="history.back()">返回</button>
            <button class="btn-advanced" onclick="showAdvancedDetails()">高级</button>
            <button class="btn-continue" onclick="continueToSite()">继续访问</button>
            <button class="btn-danger" onclick="closePage()">关闭页面</button>
        </div>
    </div>

    <script>
        // 从URL参数获取错误信息
        const urlParams = new URLSearchParams(window.location.search);
        const hostname = urlParams.get('hostname') || '未知网站';
        const url = urlParams.get('url') || 'https://example.com';
        const error = urlParams.get('error') || '未知错误';

        // 更新页面内容
        document.getElementById('hostname').textContent = hostname;
        document.getElementById('url-display').textContent = url;
        document.getElementById('error-message').textContent = getCertificateErrorMessage(error);
        
        // 更新详细错误信息
        const detailedError = generateDetailedError(hostname, error);
        document.getElementById('detailed-error').textContent = detailedError;
        
        // 更新当前日期
        const currentDate = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        document.getElementById('current-date').textContent = currentDate.toLocaleDateString('zh-CN', options);

        // 显示高级详情
        function showAdvancedDetails() {
            document.body.classList.add('advanced-visible');
        }

        // 继续访问网站
        function continueToSite() {
            // 通过Electron的IPC通信告诉主进程继续访问
            if (window.require && window.require('electron')) {
                const { ipcRenderer } = window.require('electron');
                ipcRenderer.send('ssl-continue-access', url);
            } else {
                // 如果无法使用IPC，尝试直接重定向
                window.location.href = url;
            }
        }

        // 关闭页面
        function closePage() {
            window.location.href = 'about:blank';
        }

        // 错误消息映射函数
        function getCertificateErrorMessage(error) {
            const errorMessages = {
                'net::ERR_CERT_DATE_INVALID': '证书已过期或尚未生效',
                'net::ERR_CERT_COMMON_NAME_INVALID': '证书域名不匹配',
                'net::ERR_CERT_AUTHORITY_INVALID': '证书颁发机构不可信',
                'net::ERR_CERT_REVOKED': '证书已被吊销',
                'net::ERR_CERT_INVALID': '证书无效',
                'net::ERR_SSL_PROTOCOL_ERROR': 'SSL协议错误',
                'net::ERR_CONNECTION_CLOSED': '连接已关闭',
                'net::ERR_CONNECTION_RESET': '连接被重置',
                'net::ERR_CONNECTION_REFUSED': '连接被拒绝',
                'net::ERR_NAME_NOT_RESOLVED': '无法解析域名',
                'net::ERR_INTERNET_DISCONNECTED': '网络已断开',
                'net::ERR_NETWORK_IO_SUSPENDED': '网络IO已暂停',
                'net::ERR_SSL_PINNED_KEY_NOT_IN_CERT_CHAIN': 'SSL固定密钥不在证书链中',
                'net::ERR_SSL_CLIENT_AUTH_CERT_NEEDED': '需要客户端证书',
                'net::ERR_TUNNEL_CONNECTION_FAILED': '隧道连接失败',
                'net::ERR_CERT_WEAK_SIGNATURE_ALGORITHM': '证书签名算法太弱',
                'net::ERR_CERT_SYMantec_LEGACY': '证书由Symantec颁发（已不被信任）',
                'net::ERR_CERT_KNOWN_INTERCEPTION_BLOCKED': '证书被已知拦截器阻止'
            };
            return errorMessages[error] || error || '未知错误';
        }

        // 生成详细错误描述
        function generateDetailedError(hostname, error) {
            const errorDetails = {
                'net::ERR_CERT_DATE_INVALID': `此服务器无法证明其所在网域是 ${hostname}；其安全证书已在 82 天前过期。`,
                'net::ERR_CERT_COMMON_NAME_INVALID': `此服务器提供的安全证书与 ${hostname} 的域名不匹配。`,
                'net::ERR_CERT_AUTHORITY_INVALID': `此服务器提供的安全证书颁发机构不可信。`,
                'net::ERR_CERT_REVOKED': `此服务器提供的安全证书已被颁发机构吊销。`,
                'net::ERR_CERT_INVALID': `此服务器提供的安全证书格式无效。`,
                'net::ERR_SSL_PROTOCOL_ERROR': `与 ${hostname} 的SSL协议通信发生错误。`
            };
            
            return errorDetails[error] || `此服务器 ${hostname} 存在安全证书问题：${getCertificateErrorMessage(error)}。`;
        }
    </script>
</body>
</html>
