<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 登录</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background: white;
            padding: 30px;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h2 {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            height: 44px;
            padding: 0 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .form-input:focus {
            border-color: #4b8bff;
            box-shadow: 0 0 0 3px rgba(75, 139, 255, 0.15);
        }
        
        .form-input:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }
        
        .code-input-group {
            display: flex;
            gap: 12px;
        }
        
        .code-input-group .form-input {
            flex: 1;
        }
        
        .send-code-btn {
            flex-shrink: 0;
            width: 120px;
            height: 44px;
            border: 1px solid #4b8bff;
            background: transparent;
            color: #4b8bff;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .send-code-btn:hover:not(:disabled) {
            background: #4b8bff;
            color: white;
        }
        
        .send-code-btn:disabled {
            border-color: #ccc;
            color: #ccc;
            cursor: not-allowed;
        }
        
        .login-btn {
            width: 100%;
            height: 44px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #5c9dff, #3f7dff);
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        
        .login-btn:hover {
            opacity: 0.9;
        }
        
        .login-btn:active {
            transform: scale(0.98);
        }
        
        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            transition: color 0.2s;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .close-btn:hover {
            color: #333;
        }
        
        /* 自定义提示框样式 */
        .toast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }
        
        .toast-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .toast-box {
            background: white;
            padding: 24px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            max-width: 320px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.2s;
        }
        
        .toast-overlay.show .toast-box {
            transform: scale(1);
        }
        
        .toast-text {
            font-size: 15px;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .toast-btn {
            padding: 10px 32px;
            background: linear-gradient(90deg, #5c9dff, #3f7dff);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .toast-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <button class="close-btn" id="closeBtn">&times;</button>
    <div class="login-container">
        <div class="login-header">
            <h2>个人中心</h2>
            <p>请登录以继续</p>
        </div>
        <div class="login-form">
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" value="sszu@qq.com" class="form-input" placeholder="请输入邮箱地址" autofocus>
            </div>
            <div class="form-group">
                <label for="code">验证码</label>
                <div class="code-input-group">
                    <input type="text" id="code" class="form-input" placeholder="请输入验证码" maxlength="6">
                    <button id="sendCodeBtn" class="send-code-btn">获取验证码</button>
                </div>
            </div>
            <button id="loginBtn" class="login-btn">登录</button>
        </div>
    </div>
    
    <!-- 自定义提示框 -->
    <div class="toast-overlay" id="toastOverlay">
        <div class="toast-box">
            <div class="toast-text" id="toastText"></div>
            <button class="toast-btn" id="toastBtn">确定</button>
        </div>
    </div>
    
    <script>
        const { ipcRenderer } = require('electron');

        const closeBtn = document.getElementById('closeBtn');
        const loginBtn = document.getElementById('loginBtn');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const emailInput = document.getElementById('email');
        const codeInput = document.getElementById('code');
        const toastOverlay = document.getElementById('toastOverlay');
        const toastText = document.getElementById('toastText');
        const toastBtn = document.getElementById('toastBtn');

        let countdown = 0;
        let countdownTimer = null;
        let currentFocusElement = null;

        closeBtn.addEventListener('click', () => {
            ipcRenderer.send('close-login-window');
        });

        // 自定义提示框函数
        function showToast(message, focusElement = null) {
            toastText.textContent = message;
            toastOverlay.classList.add('show');
            currentFocusElement = focusElement;

            // 确保提示框按钮可以获得焦点
            toastBtn.focus();
        }

        // 关闭提示框
        function hideToast() {
            toastOverlay.classList.remove('show');

            // 恢复焦点到指定元素
            if (currentFocusElement) {
                setTimeout(() => {
                    currentFocusElement.focus();
                    currentFocusElement = null;
                }, 50);
            }
        }

        // 提示框按钮点击
        toastBtn.addEventListener('click', hideToast);

        // 点击提示框背景关闭
        toastOverlay.addEventListener('click', (e) => {
            if (e.target === toastOverlay) {
                hideToast();
            }
        });

        // 提示框按回车关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && toastOverlay.classList.contains('show')) {
                hideToast();
            }
        });

        // 验证邮箱格式
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // 发送验证码
        sendCodeBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();

            if (!email) {
                showToast('请输入邮箱地址', emailInput);
                return;
            }

            if (!isValidEmail(email)) {
                showToast('请输入有效的邮箱地址', emailInput);
                return;
            }

            // 禁用按钮防止重复点击
            sendCodeBtn.disabled = true;
            sendCodeBtn.textContent = '发送中...';

            try {
                const result = await ipcRenderer.invoke('auth-send-code', {
                    email: email,
                    type: 'login'
                });

                if (result.success) {
                    const response = result.data;
                    if (response.code === 0) {
                        // 成功，显示提示并开始倒计时
                        let message = '验证码已发送';
                        // 如果是测试环境，验证码会返回，我们可以提示用户
                        if (response.data && response.data.code) {
                            message += `\n测试验证码: ${response.data.code}`;
                        }
                        showToast(message, codeInput);
                        startCountdown();
                    } else {
                        showToast(response.msg || '发送失败', emailInput);
                        sendCodeBtn.disabled = false;
                        sendCodeBtn.textContent = '获取验证码';
                    }
                } else {
                    showToast(result.error || '发送失败，请检查网络', emailInput);
                    sendCodeBtn.disabled = false;
                    sendCodeBtn.textContent = '获取验证码';
                }
            } catch (error) {
                console.error('发送验证码失败:', error);
                showToast('发送失败: ' + error.message, emailInput);
                sendCodeBtn.disabled = false;
                sendCodeBtn.textContent = '获取验证码';
            }
        });

        // 倒计时
        function startCountdown() {
            countdown = 60;
            sendCodeBtn.disabled = true;
            sendCodeBtn.textContent = `${countdown}秒后重试`;

            countdownTimer = setInterval(() => {
                countdown--;
                sendCodeBtn.textContent = `${countdown}秒后重试`;

                if (countdown <= 0) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                    sendCodeBtn.disabled = false;
                    sendCodeBtn.textContent = '获取验证码';
                }
            }, 1000);
        }

        // 登录
        loginBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const code = codeInput.value.trim();

            if (!email) {
                showToast('请输入邮箱地址', emailInput);
                return;
            }

            if (!isValidEmail(email)) {
                showToast('请输入有效的邮箱地址', emailInput);
                return;
            }

            if (!code) {
                showToast('请输入验证码', codeInput);
                return;
            }

            if (code.length < 4) {
                showToast('请输入有效的验证码', codeInput);
                return;
            }

            // 禁用按钮防止重复点击
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';

            try {
                const result = await ipcRenderer.invoke('auth-login', {
                    email: email,
                    code: code
                });

                if (result.success) {
                    const response = result.data;
                    if (response.code === 0) {
                        // 登录成功
                        const userData = response.data;
                        
                        // 保存登录信息到本地文件
                        try {
                            await ipcRenderer.invoke('save-user-data', userData);
                        } catch (saveError) {
                            console.error('保存用户数据失败:', saveError);
                        }

                        showToast('登录成功！');

                        // 延迟关闭窗口
                        setTimeout(() => {
                            ipcRenderer.send('close-login-window');
                        }, 1000);
                    } else {
                        showToast(response.msg || '登录失败', codeInput);
                        loginBtn.disabled = false;
                        loginBtn.textContent = '登录';
                    }
                } else {
                    showToast(result.error || '登录失败，请检查网络', codeInput);
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登录';
                }
            } catch (error) {
                console.error('登录失败:', error);
                showToast('登录失败: ' + error.message, codeInput);
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        });

        // 邮箱输入框回车
        emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !toastOverlay.classList.contains('show')) {
                sendCodeBtn.click();
            }
        });

        // 验证码输入框回车
        codeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !toastOverlay.classList.contains('show')) {
                loginBtn.click();
            }
        });
    </script>
</body>
</html>
