<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>划线记录</title>
    <link rel="stylesheet" href="underline.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>划线记录</h1>
        </div>
        
        <div class="controls">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索划线内容或网址...">
            <button class="btn" id="refreshBtn">刷新</button>
            <button class="btn btn-clear" id="clearAllBtn">清空所有</button>
        </div>
        
        <div class="underline-list" id="underlineList">
            <!-- 划线记录项将在这里动态生成 -->
            <div class="empty-state">
                <div class="empty-state-icon">✏️</div>
                <div>暂无划线记录</div>
                <div style="margin-top: 8px; font-size: 14px; color: #999;">在网页上划线后，记录将自动保存在这里</div>
            </div>
        </div>
        
        <div class="stats" id="stats">
            总计: 0 条划线记录
        </div>
        
        <div class="pagination" id="pagination">
            <!-- 分页控件将在这里生成 -->
        </div>
    </div>

    <script src="underline.js"></script>
</body>
</html>
