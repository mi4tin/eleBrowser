<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ele Browser</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
<div class="toolbar" id="toolbar">
    <div id="tabs">
        <button id="add-tab">+</button>
        <div id="tab-drop-zone" aria-hidden="true"></div>
      
    </div>
</div>
<div class="address-bar">
    <div class="nav-group">
        <button id="nav-back" class="nav-btn" title="后退">←</button>
        <button id="nav-forward" class="nav-btn" title="前进">→</button>
        <button id="nav-refresh" class="nav-btn" title="刷新">⟳</button>
    </div>
    <div class="address-input-container">
        <span id="address-favicon" class="address-favicon"><img src="" alt="" style="display:none;"></span>
        <input id="address-input" class="address-input" type="text" placeholder="输入网址并回车" autocomplete="off" />
    </div>
    <!-- <button id="address-go" class="address-go">前往</button> -->
    <button id="user-center-btn" class="user-center-btn">👤</button>
     
</div>

<!-- 个人中心登录弹窗 -->
<div id="login-modal" class="login-modal">
    <div class="login-modal-content">
        <div class="login-modal-header">
            <h2>个人中心</h2>
            <button id="login-modal-close" class="login-modal-close">×</button>
        </div>
        <div class="login-modal-body">
            <div class="login-form">
                <div class="form-group">
                    <label for="login-username">用户名</label>
                    <input type="text" id="login-username" class="form-input" placeholder="请输入用户名" />
                </div>
                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input type="password" id="login-password" class="form-input" placeholder="请输入密码" />
                </div>
                <button id="login-submit" class="login-submit-btn">登录</button>
            </div>
        </div>
    </div>
</div>

<!-- 书签栏 -->
<div class="bookmark-bar-container" id="bookmarkBarContainer" tabindex="0">
    <div class="bookmark-bar-scroll">
        <div class="bookmark-bar-content" id="bookmarkBarContent"></div>
    </div>
    <button class="bookmark-bar-arrow" id="bookmarkBarArrow">»</button>
</div>

<script src="../common/toolkit.js"></script>
<script src="index.js"></script>
</body>

</html>
