<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ele Browser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            overflow: hidden;
        }
    .toolbar {
        height: 40px;
        display: flex;
        align-items: center;
        background: #f3f3f3;
        border-bottom: 1px solid #ddd;
        padding: 0 8px;
    }
    .address-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #ddd;
        background: #fff;
    }
    .nav-group {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .nav-btn {
        width: 30px;
        height: 30px;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        background: #f7f7f7;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        color: #444;
        transition: background 0.15s, border-color 0.15s, transform 0.1s, opacity 0.15s;
    }
    .nav-btn:hover:not(:disabled) {
        background: #ededed;
        border-color: #c0c0c0;
    }
    .nav-btn:active:not(:disabled) {
        transform: translateY(1px);
    }
    .nav-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }
    .address-input {
        flex: 1;
        height: 30px;
        padding: 0 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 13px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .address-input:focus {
        border-color: #4b8bff;
        box-shadow: 0 0 0 2px rgba(75, 139, 255, 0.15);
    }
    .address-go {
        height: 30px;
        padding: 0 12px;
        border: 1px solid #4b8bff;
        border-radius: 6px;
        background: linear-gradient(90deg, #5c9dff, #3f7dff);
        color: #fff;
        cursor: pointer;
        font-size: 13px;
        transition: opacity 0.15s, transform 0.1s;
    }
    .address-go:active {
        transform: translateY(1px);
    }
    .address-go:hover {
        opacity: 0.9;
    }
        #tabs {
            display: flex;
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .tab {
            display: flex;
            align-items: center;
            padding: 4px 10px;
            margin-right: 4px;
            border-radius: 4px 4px 0 0;
            background: #e0e0e0;
            cursor: pointer;
            font-size: 12px;
            user-select: none;
            white-space: nowrap;
        }
        .tab.active {
            background: #ffffff;
            border: 1px solid #ddd;
            border-bottom-color: #ffffff;
        }
        .tab .close {
            margin-left: 6px;
            font-size: 11px;
            cursor: pointer;
        }
        #add-tab {
            width: 28px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #fafafa;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }
        #add-tab:hover {
            background-color: #eaeaea;
        }
#webviews {
    position: absolute;
    top: 82px;
    left: 0;
    right: 0;
    bottom: 0;
    background: #ffffff;
}
        webview {
            width: 100%;
            height: 100%;
            display: none;
        }
        webview.active {
            display: inline-flex;
        }
    </style>
</head>

<body>
<div class="toolbar">
    <div id="tabs"></div>
    <button id="add-tab">+</button>
</div>
<div class="address-bar">
    <div class="nav-group">
        <button id="nav-back" class="nav-btn" title="后退">←</button>
        <button id="nav-forward" class="nav-btn" title="前进">→</button>
        <button id="nav-refresh" class="nav-btn" title="刷新">⟳</button>
    </div>
    <input id="address-input" class="address-input" type="text" placeholder="输入网址并回车，或点击“前往”" />
    <button id="address-go" class="address-go">前往</button>
</div>
<div id="webviews"></div>

<script>
    const { ipcRenderer } = require('electron');

    const DEFAULT_URL = 'https://www.baidu.com';
    const tabsContainer = document.getElementById('tabs');
    const webviewsContainer = document.getElementById('webviews');
    const addTabBtn = document.getElementById('add-tab');
    const addressInput = document.getElementById('address-input');
    const goBtn = document.getElementById('address-go');
    const backBtn = document.getElementById('nav-back');
    const forwardBtn = document.getElementById('nav-forward');
    const refreshBtn = document.getElementById('nav-refresh');

    let tabIdCounter = 0;
    let currentTabId = null;

    function formatUrl(input) {
        if (!input) return DEFAULT_URL;
        const trimmed = input.trim();
        // 检查是否是 dxbrowser:// 协议
        if (trimmed.startsWith('dxbrowser://')) {
            return trimmed;
        }
        if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(trimmed)) return trimmed;
        return 'https://' + trimmed;
    }

    function updateAddressBar(url) {
        if (currentTabId == null) return;
        addressInput.value = url || '';
    }

    function loadAddressForCurrentTab() {
        const inputValue = addressInput.value.trim();
        
        // 检查是否是 dxbrowser://bookmarks/ 协议
        if (inputValue === 'dxbrowser://bookmarks/' || inputValue.startsWith('dxbrowser://bookmarks')) {
            openBookmarksTab();
            return;
        }
        
        if (currentTabId == null) return;
        const wv = document.querySelector('webview[data-id="' + currentTabId + '"]');
        if (!wv) return;
        const target = formatUrl(inputValue);
        wv.src = target;
    }
    
    function openBookmarksTab() {
        // 检查是否已经有书签管理器标签页
        const existingTab = document.querySelector('.tab[data-bookmarks="true"]');
        if (existingTab) {
            const tabId = Number(existingTab.dataset.id);
            activateTab(tabId);
            return;
        }
        
        // 创建书签管理器标签页
        const id = ++tabIdCounter;
        
        // 创建 tab 按钮
        const tabEl = document.createElement('div');
        tabEl.className = 'tab active';
        tabEl.dataset.id = id;
        tabEl.dataset.bookmarks = 'true';
        tabEl.textContent = '书签管理';
        
        const closeEl = document.createElement('span');
        closeEl.className = 'close';
        closeEl.textContent = '×';
        tabEl.appendChild(closeEl);
        
        tabsContainer.appendChild(tabEl);
        
        // 创建对应的 webview
        const wv = document.createElement('webview');
        // 使用绝对路径，因为 index.html 和 bookmarks.html 都在 html 目录下
        const path = require('path');
        const bookmarksPath = path.join(__dirname,'bookmarks.html');
        // 确保路径格式正确（Windows 路径需要转换）
        let filePath = bookmarksPath.replace(/\\/g, '/');
        if (!filePath.startsWith('/')) {
            filePath = '/' + filePath;
        }
        wv.src = 'file://' + filePath;
        wv.dataset.id = id;
        wv.setAttribute('allowpopups', 'false');
        wv.setAttribute('nodeintegration', 'true');
        wv.setAttribute('webpreferences', 'nodeIntegration=yes,contextIsolation=no');
        
        // 设置协议拦截
        wv.addEventListener('new-window', (e) => {
            e.preventDefault();
            if (e.url && (e.url.startsWith('http://') || e.url.startsWith('https://'))) {
                createTab(e.url, e.url);
            }
        });
        
        webviewsContainer.appendChild(wv);
        
        // 点击切换标签
        tabEl.addEventListener('click', (e) => {
            if (e.target === closeEl) return;
            activateTab(id);
        });
        
        // 关闭标签
        closeEl.addEventListener('click', (e) => {
            e.stopPropagation();
            closeTab(id);
        });
        
        // 激活新建的标签
        currentTabId = id;
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.toggle('active', Number(tab.dataset.id) === id);
        });
        document.querySelectorAll('webview').forEach(wv => {
            wv.classList.toggle('active', Number(wv.dataset.id) === id);
        });
        
        updateAddressBar('dxbrowser://bookmarks/');
    }

    function updateNavButtons() {
        const wv = currentTabId != null
            ? document.querySelector('webview[data-id="' + currentTabId + '"]')
            : null;
        const canGoBack = wv && typeof wv.canGoBack === 'function' && wv.canGoBack();
        const canGoForward = wv && typeof wv.canGoForward === 'function' && wv.canGoForward();
        backBtn.disabled = !canGoBack;
        forwardBtn.disabled = !canGoForward;
        refreshBtn.disabled = !wv;
    }

    function createTab(url = DEFAULT_URL, title = '新标签页') {
        const id = ++tabIdCounter;
        
        // 检查是否是书签管理器
        const isBookmarks = url === 'dxbrowser://bookmarks/' || url.includes('bookmarks.html');
        if (isBookmarks) {
            return openBookmarksTab();
        }

        // 创建 tab 按钮
        const tabEl = document.createElement('div');
        tabEl.className = 'tab';
        tabEl.dataset.id = id;
        tabEl.textContent = title;

        const closeEl = document.createElement('span');
        closeEl.className = 'close';
        closeEl.textContent = '×';
        tabEl.appendChild(closeEl);

        tabsContainer.appendChild(tabEl);

        // 创建对应的 webview
        const wv = document.createElement('webview');
        // 处理 dxbrowser://bookmarks/ 协议，转换为本地文件路径
        let srcUrl = url;
        if (url === 'dxbrowser://bookmarks/' || url.startsWith('dxbrowser://bookmarks')) {
            // 使用绝对路径加载本地文件
            const path = require('path');
            console.log("path11:",__dirname);
            const bookmarksPath = path.join(__dirname, 'bookmarks.html');
            // 确保路径格式正确（Windows 路径需要转换）
            let filePath = bookmarksPath.replace(/\\/g, '/');
            if (!filePath.startsWith('/')) {
                filePath = '/' + filePath;
            }
            srcUrl = 'file://' + filePath;
        }
        wv.src = srcUrl;
        wv.dataset.id = id;
        wv.setAttribute('nodeintegration', 'true');
        wv.setAttribute('webpreferences', 'nodeIntegration=yes,contextIsolation=no');
        // 禁用弹出窗口，防止自定义协议链接打开外部应用
        wv.setAttribute('allowpopups', 'false');
        
        // 辅助函数：检查是否为自定义协议
        function isCustomProtocol(url) {
            if (!url) return false;
            try {
                const parsedUrl = new URL(url);
                return parsedUrl.protocol !== 'http:' && parsedUrl.protocol !== 'https:' && parsedUrl.protocol !== 'file:';
            } catch (e) {
                // 如果 URL 解析失败，检查是否以常见协议开头
                return !url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('file://');
            }
        }
        
        // 阻止自定义协议；对于正常 http/https 链接，改为新建标签页打开
        wv.addEventListener('new-window', (e) => {
            if (isCustomProtocol(e.url)) {
                e.preventDefault();
                console.log('阻止打开自定义协议链接:', e.url);
                return;
            }

            if (e.url && (e.url.startsWith('http://') || e.url.startsWith('https://'))) {
                e.preventDefault();
                // 在新标签中打开原本要新窗口打开的链接
                createTab(e.url, e.url);
            }
        });
        
        // 阻止导航到自定义协议
        wv.addEventListener('will-navigate', (e) => {
            if (isCustomProtocol(e.url)) {
                e.preventDefault();
                console.log('阻止导航到自定义协议:', e.url);
            }
        });
        
        // 监听 webview 的 webContents 事件（通过 IPC）
        wv.addEventListener('did-attach', () => {
            // webview 附加后，主进程的事件监听器会自动处理
        });
        
        // 在页面加载前注入 JavaScript 来拦截所有协议链接
        wv.addEventListener('did-start-loading', () => {
            // 在页面开始加载时就注入拦截代码
            wv.executeJavaScript(`
                (function() {
                    // 立即拦截所有可能的协议调用方式
                    if (window.location && window.location.href) {
                        const currentHref = window.location.href;
                        if (currentHref && !currentHref.startsWith('http://') && !currentHref.startsWith('https://') && !currentHref.startsWith('file://') && currentHref.includes('://')) {
                            console.log('阻止初始加载的自定义协议:', currentHref);
                            window.stop();
                            return;
                        }
                    }
                })();
            `).catch(() => {});
        });
        
        // 在页面加载时注入 JavaScript 来拦截所有协议链接
        wv.addEventListener('dom-ready', () => {
            // 注入代码拦截所有链接点击和协议调用
            wv.executeJavaScript(`
                (function() {
                    // 拦截所有链接点击
                    document.addEventListener('click', function(e) {
                        let target = e.target;
                        while (target && target.tagName !== 'A') {
                            target = target.parentElement;
                        }
                        if (target && target.href) {
                            const url = target.href;
                            if (url && !url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('file://') && url.includes('://')) {
                                e.preventDefault();
                                e.stopPropagation();
                                e.stopImmediatePropagation();
                                console.log('阻止自定义协议链接:', url);
                                return false;
                            }
                        }
                    }, true); // 使用捕获阶段
                    
                    // 拦截 window.open 调用
                    const originalOpen = window.open;
                    window.open = function(url, target, features) {
                        if (url && !url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('file://') && url.includes('://')) {
                            console.log('阻止 window.open 自定义协议:', url);
                            return null;
                        }
                        return originalOpen.call(window, url, target, features);
                    };
                    
                    // 拦截 location.href 赋值
                    try {
                        const locationDescriptor = Object.getOwnPropertyDescriptor(window, 'location');
                        if (locationDescriptor && locationDescriptor.set) {
                            const originalLocationSetter = locationDescriptor.set;
                            Object.defineProperty(window, 'location', {
                                set: function(url) {
                                    if (url && !url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('file://') && url.includes('://')) {
                                        console.log('阻止 location 跳转到自定义协议:', url);
                                        return;
                                    }
                                    originalLocationSetter.call(window, url);
                                },
                                get: locationDescriptor.get
                            });
                        }
                    } catch (e) {
                        // 某些浏览器可能不允许修改 location
                        console.log('无法拦截 location:', e);
                    }
                })();
            `).catch(err => console.log('注入脚本失败:', err));
        });
        
        webviewsContainer.appendChild(wv);

        // 点击切换标签
        tabEl.addEventListener('click', (e) => {
            if (e.target === closeEl) return; // 关闭按钮单独处理
            activateTab(id);
        });

        // 关闭标签
        closeEl.addEventListener('click', (e) => {
            e.stopPropagation();
            closeTab(id);
        });

        // webview 加载完成后尝试更新标题
        wv.addEventListener('page-title-updated', (event) => {
            tabEl.firstChild.textContent = event.title || title;
        });

        const syncAddress = (nextUrl) => {
            if (currentTabId === id) {
                updateAddressBar(nextUrl || wv.getURL?.() || wv.src);
            }
        };
        wv.addEventListener('did-navigate', (event) => syncAddress(event.url));
        wv.addEventListener('did-navigate-in-page', (event) => syncAddress(event.url));
        wv.addEventListener('did-stop-loading', () => {
            syncAddress(wv.getURL?.() || wv.src);
            updateNavButtons();
        });

        // 激活新建的标签
        activateTab(id);
        syncAddress(url);
        updateNavButtons();
    }

    function activateTab(id) {
        currentTabId = id;

        // 切换 tab 样式
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.toggle('active', Number(tab.dataset.id) === id);
        });

        // 切换 webview 显示
        document.querySelectorAll('webview').forEach(wv => {
            wv.classList.toggle('active', Number(wv.dataset.id) === id);
        });

        const activeWv = document.querySelector('webview[data-id="' + id + '"]');
        if (activeWv) {
            updateAddressBar(activeWv.getURL?.() || activeWv.src);
        }
        updateNavButtons();
    }

    function closeTab(id) {
        const tabEl = document.querySelector('.tab[data-id="' + id + '"]');
        const wv = document.querySelector('webview[data-id="' + id + '"]');

        if (tabEl) tabEl.remove();
        if (wv) wv.remove();

        // 如果关的是当前标签，自动激活一个相邻的
        if (currentTabId === id) {
            const remainingTabs = document.querySelectorAll('.tab');
            if (remainingTabs.length > 0) {
                const lastTab = remainingTabs[remainingTabs.length - 1];
                activateTab(Number(lastTab.dataset.id));
            } else {
                currentTabId = null;
            }
        }
    }

    // "+" 按钮：新建标签
    addTabBtn.addEventListener('click', () => {
        createTab();
    });

    backBtn.addEventListener('click', () => {
        const wv = document.querySelector('webview[data-id="' + currentTabId + '"]');
        if (wv && typeof wv.canGoBack === 'function' && wv.canGoBack()) {
            wv.goBack();
        }
    });
    forwardBtn.addEventListener('click', () => {
        const wv = document.querySelector('webview[data-id="' + currentTabId + '"]');
        if (wv && typeof wv.canGoForward === 'function' && wv.canGoForward()) {
            wv.goForward();
        }
    });
    refreshBtn.addEventListener('click', () => {
        const wv = document.querySelector('webview[data-id="' + currentTabId + '"]');
        if (wv && typeof wv.reload === 'function') {
            wv.reload();
        }
    });

    addressInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            loadAddressForCurrentTab();
        }
    });

    // 全局快捷键：F12 打开开发者工具
    document.addEventListener('keydown', (e) => {
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            e.stopPropagation();
            const wv = currentTabId != null
                ? document.querySelector('webview[data-id="' + currentTabId + '"]')
                : null;
            if (wv) {
                // 通过 IPC 发送消息到主进程，让主进程打开开发者工具
                // 主进程会通过 web-contents-created 事件找到对应的 webContents
                ipcRenderer.send('open-devtools-for-webview', currentTabId);
            }
        }
    });
    goBtn.addEventListener('click', () => {
        loadAddressForCurrentTab();
    });

    // 监听主进程菜单：新建标签
    ipcRenderer.on('new-tab', () => {
        createTab();
    });

    // 监听主进程菜单：刷新当前标签
    ipcRenderer.on('refresh-tab', () => {
        if (currentTabId == null) return;
        const wv = document.querySelector('webview[data-id="' + currentTabId + '"]');
        if (wv) {
            wv.reload();
        }
    });

    // 主进程要求在新标签中打开链接
    ipcRenderer.on('open-url-in-new-tab', (_event, url) => {
        console.log("主窗口收到打开URL请求:", url);
        if (url && (url.startsWith('http://') || url.startsWith('https://'))) {
            console.log("创建新标签页:", url);
            createTab(url, url);
        } else {
            console.log("URL格式不正确，已忽略:", url);
        }
    });

    // 主进程要求打开书签管理器标签页
    ipcRenderer.on('open-bookmarks-tab', () => {
        console.log("主窗口收到打开书签管理器请求");
        openBookmarksTab();
    });

    // 主进程要求打开指定标签页的开发者工具
    ipcRenderer.on('open-devtools-for-tab', (_event, tabId) => {
        const wv = document.querySelector('webview[data-id="' + tabId + '"]');
        if (wv) {
            // 尝试打开开发者工具
            const tryOpenDevTools = () => {
                try {
                    // 方法1: 直接调用 openDevTools（如果可用）
                    if (typeof wv.openDevTools === 'function') {
                        wv.openDevTools();
                        return;
                    }
                    // 方法2: 通过 getWebContents
                    if (wv.getWebContents) {
                        const webContents = wv.getWebContents();
                        if (webContents && typeof webContents.openDevTools === 'function') {
                            webContents.openDevTools();
                            return;
                        }
                    }
                } catch (err) {
                    console.error('打开开发者工具失败:', err);
                }
            };
            
            // 如果 webview 已附加，直接尝试
            tryOpenDevTools();
            
            // 如果失败，等待 webview 附加
            wv.addEventListener('did-attach', tryOpenDevTools, { once: true });
        }
    });


    // 启动时自动创建一个标签
    createTab();
</script>
</body>

</html>
