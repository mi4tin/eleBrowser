const container = document.getElementById('content');


function underlineTextWithRange(text) {
  if (!container || !text) return;
  
  // 清空现有下划线（可选）
//   removeUnderlines(container);
  
  const walker = document.createTreeWalker(
    container,
    NodeFilter.SHOW_TEXT,
    null,
    false
  );
  
  let fullText = '';
  const textNodes = [];
  let node;
  
  // 收集所有文本节点并构建完整文本（跳过纯空白节点，避免标签换行导致匹配失败）
  while (node = walker.nextNode()) {
    if (/^\s+$/.test(node.textContent)) continue;
    fullText += node.textContent;
    textNodes.push({
      node: node,
      start: fullText.length - node.textContent.length,
      end: fullText.length
    });
  }
  
  // 查找所有匹配位置
  const matches = [];
  let startIndex = 0;
  while ((startIndex = fullText.indexOf(text, startIndex)) !== -1) {
    matches.push({
      start: startIndex,
      end: startIndex + text.length
    });
    startIndex += text.length;
  }
  
  // 处理每个匹配
  matches.forEach(match => {
    const fragments = [];
    
    // 找出与匹配范围相交的文本节点
    textNodes.forEach(textNode => {
      const overlapStart = Math.max(textNode.start, match.start);
      const overlapEnd = Math.min(textNode.end, match.end);
      
      if (overlapStart < overlapEnd) {
        fragments.push({
          node: textNode.node,
          start: overlapStart - textNode.start,
          end: overlapEnd - textNode.start
        });
      }
    });
    
    // 按顺序处理每个片段
    fragments.forEach(fragment => {
      const { node, start, end } = fragment;
      const parent = node.parentNode;
      
      // 如果父元素已经是下划线元素，跳过
      if (parent.classList && parent.classList.contains('underlined-text')) {
        return;
      }
      
      // 分割文本节点
      const wholeText = node.textContent;
      
      // 创建文档片段
      const docFragment = document.createDocumentFragment();
      
      // 添加前半部分（如果存在）
      if (start > 0) {
        const beforeText = wholeText.substring(0, start);
        docFragment.appendChild(document.createTextNode(beforeText));
      }
      
      // 创建下划线元素并添加中间部分
      const underlineSpan = document.createElement('span');
      underlineSpan.className = 'underlined-text';
      underlineSpan.setAttribute('name', 'underlined-text-aa');
      underlineSpan.textContent = wholeText.substring(start, end);
      docFragment.appendChild(underlineSpan);
      
      // 添加后半部分（如果存在）
      if (end < wholeText.length) {
        const afterText = wholeText.substring(end);
        docFragment.appendChild(document.createTextNode(afterText));
      }
      
      // 替换原文本节点
      if (node.parentNode) {
        node.parentNode.replaceChild(docFragment, node);
      }
    });
  });
}



/**
 * 跨标签添加下划线，支持同一文本节点的多个匹配
 * @param {HTMLElement} container 
 * @param {string} text 
 */
function underlineAllMatchesWithRange(container, text) {
  if (!container || !text) return;

  // 1. 收集所有文本节点，构建完整文本和位置映射
  const walker = document.createTreeWalker(
    container,
    NodeFilter.SHOW_TEXT,
    null,
    false
  );

  let fullText = '';
  const textNodes = [];
  let node;
  while ((node = walker.nextNode())) {
    textNodes.push({
      node,
      start: fullText.length,
      end: fullText.length + node.textContent.length,
      content: node.textContent
    });
    fullText += node.textContent;
  }

  // 2. 找到所有匹配位置
  const matches = [];
  let startIndex = 0;
  while ((startIndex = fullText.indexOf(text, startIndex)) !== -1) {
    matches.push({
      start: startIndex,
      end: startIndex + text.length
    });
    startIndex += text.length;
  }

  if (matches.length === 0) return;

  // 3. 按结束位置从大到小排序（从后往前处理）
  matches.sort((a, b) => b.end - a.end);

  // 4. 处理每个匹配
  matches.forEach(match => {
    // 找出与当前匹配重叠的文本节点片段
    const fragments = [];
    textNodes.forEach(nodeInfo => {
      const overlapStart = Math.max(nodeInfo.start, match.start);
      const overlapEnd = Math.min(nodeInfo.end, match.end);
      
      if (overlapStart < overlapEnd) {
        fragments.push({
          node: nodeInfo.node,
          start: overlapStart - nodeInfo.start,
          end: overlapEnd - nodeInfo.start,
          originalContent: nodeInfo.content
        });
      }
    });

    // 处理每个片段（注意：这里操作的 node 是原始文本节点，可能已经被之前的匹配替换）
    // 但因为我们是从后往前处理，并且每个 node 是原始节点引用，如果该节点已经被替换，它就不在 DOM 中了
    // 因此需要检查节点是否还在文档中
    fragments.forEach(fragment => {
      const { node, start, end, originalContent } = fragment;
      
      // 如果节点已经被移除，跳过（实际上，由于从后往前处理，后面的匹配不会破坏前面的节点）
      if (!node.parentNode) return;

      const parent = node.parentNode;
      
      // 如果父元素已经是下划线元素且不属于当前处理，跳过
      if (parent.classList && parent.classList.contains('underlined-text')) {
        return;
      }

      const currentText = node.textContent; // 使用实时文本内容

      // 分割文本节点
      const docFragment = document.createDocumentFragment();
      
      if (start > 0) {
        docFragment.appendChild(
          document.createTextNode(currentText.substring(0, start))
        );
      }

      const underlineSpan = document.createElement('span');
      underlineSpan.className = 'underlined-text';
      underlineSpan.textContent = currentText.substring(start, end);
      docFragment.appendChild(underlineSpan);

      if (end < currentText.length) {
        docFragment.appendChild(
          document.createTextNode(currentText.substring(end))
        );
      }

      parent.replaceChild(docFragment, node);
    });
  });

  // 5. 合并相邻文本节点，清理多余空文本节点
  container.normalize();
}




/**
 * 包裹单个文本节点中的一段
 */
function wrapTextNodeSegment(node, start, end) {
  const parent = node.parentNode;
  if (!parent) return;
  if (parent.classList && parent.classList.contains('underlined-text')) return;

  const content = node.textContent;
  const fragment = document.createDocumentFragment();

  if (start > 0) {
    fragment.appendChild(document.createTextNode(content.substring(0, start)));
  }

  const span = document.createElement('span');
  span.className = 'underlined-text';
  span.textContent = content.substring(start, end);
  fragment.appendChild(span);

  if (end < content.length) {
    fragment.appendChild(document.createTextNode(content.substring(end)));
  }

  parent.replaceChild(fragment, node);
}



// 移除所有下划线（可选功能）
function removeUnderlines(container) {
  const underlines = container.querySelectorAll('.underlined-text');
  underlines.forEach(underline => {
    const parent = underline.parentNode;
    const text = document.createTextNode(underline.textContent);
    parent.replaceChild(text, underline);
    // 合并相邻的文本节点
    parent.normalize();
  });
}


function underlineWithSelection(container, text) {
  if (!container || !text) return;
  
  // 创建临时元素
  const temp = document.createElement('div');
  temp.innerHTML = container.innerHTML;
  
  // 创建 Range 进行搜索
  const walker = document.createTreeWalker(
    temp,
    NodeFilter.SHOW_TEXT,
    null,
    false
  );
  
  let fullText = '';
  const nodes = [];
  let node;
  
  while (node = walker.nextNode()) {
    fullText += node.textContent;
    nodes.push(node);
  }
  
  const index = fullText.indexOf(text);
  if (index === -1) return;
  
  // 找到匹配的节点范围
  let charCount = 0;
  let startNode = null, endNode = null;
  let startOffset = 0, endOffset = 0;
  
  for (const currentNode of nodes) {
    const nodeLength = currentNode.textContent.length;
    
    if (!startNode && charCount + nodeLength > index) {
      startNode = currentNode;
      startOffset = index - charCount;
    }
    
    if (!endNode && charCount + nodeLength >= index + text.length) {
      endNode = currentNode;
      endOffset = index + text.length - charCount;
      break;
    }
    
    charCount += nodeLength;
  }
  
  if (startNode && endNode) {
    const range = document.createRange();
    range.setStart(startNode, startOffset);
    range.setEnd(endNode, endOffset);
    
    const underline = document.createElement('span');
    underline.className = 'underlined-text';
    
    try {
      range.surroundContents(underline);
      container.innerHTML = temp.innerHTML;
    } catch (e) {
      console.warn('无法跨标签包裹内容:', e);
    }
  }
}

    nodes.push(node);

  // 拼接所有文本内容，并记录每个节点在总文本中的位置
  let fullText = '';
  const nodeRanges = [];
  
  nodes.forEach(node => {
    const start = fullText.length;
    fullText += node.textContent;
    const end = fullText.length;
    nodeRanges.push({ node, start, end });
  });
  
  // 查找所有匹配的位置
  const matches = [];
  let startIndex = 0;
  
  while ((startIndex = fullText.indexOf(text, startIndex)) !== -1) {
    const endIndex = startIndex + text.length;
    matches.push({ start: startIndex, end: endIndex });
    startIndex = endIndex;
  }
  
  // 对每个匹配进行处理
  matches.forEach(match => {
    const fragments = [];
    
    // 找出与匹配范围有重叠的节点
    nodeRanges.forEach(range => {
      const overlapStart = Math.max(range.start, match.start);
      const overlapEnd = Math.min(range.end, match.end);
      
      if (overlapStart < overlapEnd) {
        const nodeStart = overlapStart - range.start;
        const nodeEnd = overlapEnd - range.start;
        
        fragments.push({
          node: range.node,
          start: nodeStart,
          end: nodeEnd
        });
      }
    });
    
    // 处理每个片段
    fragments.forEach((fragment, index) => {
      const { node, start, end } = fragment;
      const parent = node.parentNode;
      
      if (start === 0 && end === node.textContent.length) {
        // 整个文本节点都需要添加下划线
        const underline = document.createElement('span');
        underline.className = 'underlined-text';
        underline.textContent = node.textContent;
        parent.replaceChild(underline, node);
      } else if (start > 0 || end < node.textContent.length) {
        // 只有部分文本需要添加下划线
        const beforeText = node.textContent.substring(0, start);
        const underlineText = node.textContent.substring(start, end);
        const afterText = node.textContent.substring(end);
        
        const underline = document.createElement('span');
        underline.className = 'underlined-text';
        underline.textContent = underlineText;
        
        const fragment = document.createDocumentFragment();
        if (beforeText) {
          fragment.appendChild(document.createTextNode(beforeText));
        }
        fragment.appendChild(underline);
        if (afterText) {
          fragment.appendChild(document.createTextNode(afterText));
        }
        
        parent.replaceChild(fragment, node);
      }
    });
  });
}



function underlineAllMatchesDynamic(container, text) {
  if (!container || !text) return;

  // 1. 获取当前容器的完整文本内容，找到所有匹配位置
  const fullText = container.textContent;
  const matches = [];
  let startIdx = 0;
  while ((startIdx = fullText.indexOf(text, startIdx)) !== -1) {
    matches.push({
      start: startIdx,
      end: startIdx + text.length
    });
    startIdx += text.length;
  }

  if (matches.length === 0) return;

  // 2. 按结束位置降序处理（从后往前）
  matches.sort((a, b) => b.end - a.end);

  // 3. 处理每个匹配
  matches.forEach(match => {
    // 动态定位起始节点和结束节点（基于当前 DOM）
    const startInfo = getTextNodeAtPosition(container, match.start);
    const endInfo = getTextNodeAtPosition(container, match.end - 1); // 结束位置-1，确保落在文本节点内

    const startNode = startInfo.node;
    const endNode = endInfo.node;
    const startOffset = startInfo.offset;
    const endOffset = endInfo.offset + 1; // 因为 endInfo 对应的是最后一个字符的位置

    // 如果起始节点和结束节点是同一个文本节点
    if (startNode === endNode) {
      wrapTextNodeSegment(startNode, startOffset, endOffset);
    } else {
      // 跨越多个文本节点
      handleMultiNodeRange(startNode, startOffset, endNode, endOffset);
    }
  });

  // 合并相邻文本节点（可选，但建议保留以保持结构清晰）
  // container.normalize();
}




/**
 * 跨标签添加下划线，支持同一文本节点内任意多个匹配
 * @param {HTMLElement} container 
 * @param {string} text 
 */
function underlineAllMatches(container, text) {
  if (!container || !text) return;

  const fullText = container.textContent;
  const matches = [];
  let pos = 0;
  while ((pos = fullText.indexOf(text, pos)) !== -1) {
    matches.push({ start: pos, end: pos + text.length });
    pos += text.length;
  }
  if (matches.length === 0) return;

  matches.sort((a, b) => b.end - a.end);

  matches.forEach(match => {
    try {
      const startInfo = getTextNodeAtPosition(container, match.start);
      const endInfo = getTextNodeAtPosition(container, match.end - 1);
      
      if (startInfo.node === endInfo.node) {
        wrapTextNodeSegment(startInfo.node, startInfo.offset, endInfo.offset + 1);
      } else {
        handleMultiNodeRange(
          startInfo.node, startInfo.offset,
          endInfo.node, endInfo.offset + 1
        );
      }
    } catch (e) {
      console.warn('处理匹配失败:', match, e);
    }
  });
}

// 辅助函数
/**
 * 处理跨文本节点的范围
 */
 function handleMultiNodeRange(startNode, startOffset, endNode, endOffset) {
  // 1. 处理起始节点（保留后半部分）
  const startParent = startNode.parentNode;
  if (startParent) {
    const startContent = startNode.textContent;
    const startFrag = document.createDocumentFragment();
    
    // 从 startOffset 到末尾的内容加上下划线
    const underlineSpan = document.createElement('span');
    underlineSpan.className = 'underlined-text';
    underlineSpan.textContent = startContent.substring(startOffset);
    startFrag.appendChild(underlineSpan);
    
    // 前半部分保留为纯文本（如果存在）
    if (startOffset > 0) {
      const beforeText = document.createTextNode(startContent.substring(0, startOffset));
      startFrag.insertBefore(beforeText, underlineSpan);
    }
    
    startParent.replaceChild(startFrag, startNode);
  }

  // 2. 处理结束节点（保留前半部分）
  const endParent = endNode.parentNode;
  if (endParent) {
    const endContent = endNode.textContent;
    const endFrag = document.createDocumentFragment();
    
    // 从开头到 endOffset 的内容加上下划线
    const underlineSpan = document.createElement('span');
    underlineSpan.className = 'underlined-text';
    underlineSpan.textContent = endContent.substring(0, endOffset);
    endFrag.appendChild(underlineSpan);
    
    // 后半部分保留为纯文本（如果存在）
    if (endOffset < endContent.length) {
      const afterText = document.createTextNode(endContent.substring(endOffset));
      endFrag.appendChild(afterText);
    }
    
    endParent.replaceChild(endFrag, endNode);
  }

  // 3. 处理中间的所有文本节点（整个包裹）
  let currentNode = startNode.nextSibling;
  while (currentNode && currentNode !== endNode) {
    if (currentNode.nodeType === Node.TEXT_NODE && currentNode.parentNode) {
      const parent = currentNode.parentNode;
      const content = currentNode.textContent;
      if (content.length > 0) {
        const span = document.createElement('span');
        span.className = 'underlined-text';
        span.textContent = content;
        parent.replaceChild(span, currentNode);
      }
    }
    currentNode = currentNode.nextSibling;
  }
}


/**
 * 在容器中，根据全局字符偏移量查找所在的文本节点及内部偏移
 * @param {HTMLElement} container 
 * @param {number} offset - 从容器文本开头计算的字符偏移（0-based）
 * @returns {{ node: Text, offset: number }} 文本节点和内部偏移
 */
 function getTextNodeAtPosition(container, offset) {
  const walker = document.createTreeWalker(
    container,
    NodeFilter.SHOW_TEXT,
    null,
    false
  );

  let currentPos = 0;
  let node;
  while ((node = walker.nextNode())) {
    const nodeLength = node.textContent.length;
    if (offset < currentPos + nodeLength) {
      return {
        node: node,
        offset: offset - currentPos
      };
    }
    currentPos += nodeLength;
  }
  throw new Error(`Offset ${offset} out of range`);
}

/**
 * 包裹单个文本节点中的一段
 */
function wrapTextNodeSegment(node, start, end) {
  const parent = node.parentNode;
  if (!parent) return;
  if (parent.classList && parent.classList.contains('underlined-text')) return;

  const content = node.textContent;
  const fragment = document.createDocumentFragment();

  if (start > 0) {
    fragment.appendChild(document.createTextNode(content.substring(0, start)));
  }

  const span = document.createElement('span');
  span.className = 'underlined-text';
  span.textContent = content.substring(start, end);
  fragment.appendChild(span);

  if (end < content.length) {
    fragment.appendChild(document.createTextNode(content.substring(end)));
  }

  parent.replaceChild(fragment, node);
}
