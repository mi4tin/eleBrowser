<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录自动匹配</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background: #fff;
            overflow: hidden;
        }
        
        .history-autocomplete-container {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .history-autocomplete-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.15s;
        }
        
        .history-autocomplete-item:last-child {
            border-bottom: none;
        }
        
        .history-autocomplete-item:hover,
        .history-autocomplete-item.selected {
            background-color: #f0f7ff;
        }
        
        .history-autocomplete-item .favicon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        
        .history-autocomplete-item .favicon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .history-autocomplete-item .content {
            flex: 1;
            min-width: 0;
        }
        
        .history-autocomplete-item .title {
            font-size: 13px;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        
        .history-autocomplete-item .url {
            font-size: 11px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .empty-state {
            padding: 20px;
            text-align: center;
            color: #999;
            font-size: 14px;
        }
        
        /*条样式 */
        .history-autocomplete-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .history-autocomplete-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        .history-autocomplete-container::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
        
        .history-autocomplete-container::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <div class="history-autocomplete-container" id="autocomplete-container">
        <div class="empty-state">开始输入搜索历史记录</div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const container = document.getElementById('autocomplete-container');
        let selectedItems = [];
        let selectedIndex = -1;
        
        //渲染匹配结果
        function renderResults(items) {
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="empty-state">没有找到匹配的历史记录</div>';
                selectedItems = [];
                selectedIndex = -1;
                return;
            }
            
            selectedItems = items;
            selectedIndex = -1;
            
            let html = '';
            items.forEach((item, index) => {
                html += `
                    <div class="history-autocomplete-item" data-index="${index}">
                        <div class="favicon">
                            <img src="https://www.google.com/s2/favicons?domain=${new URL(item.url).hostname}" onerror="this.style.display='none'" />
                        </div>
                        <div class="content">
                            <div class="title">${escapeHtml(item.title)}</div>
                            <div class="url">${escapeHtml(item.url)}</div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        //HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        //选择项
        function selectItem(index) {
            const items = container.querySelectorAll('.history-autocomplete-item');
            items.forEach(item => item.classList.remove('selected'));
            
            if (index >= 0 && index < items.length) {
                items[index].classList.add('selected');
                selectedIndex = index;
                //滚到可见区域
                items[index].scrollIntoView({ block: 'nearest' });
            }
        }
        
        //点击事件
        container.addEventListener('click', (e) => {
            const item = e.target.closest('.history-autocomplete-item');
            if (item) {
                const index = parseInt(item.dataset.index);
                if (index >= 0 && index < selectedItems.length) {
                    const selectedItem = selectedItems[index];
                    // 通过IPC发送选择结果到主进程
                    ipcRenderer.invoke('history-autocomplete-selected', selectedItem);
                }
            }
        });
        
        //接收匹配结果
        ipcRenderer.on('update-history-autocomplete', (event, items) => {
            renderResults(items);
        });
        
        //接收键盘导航指令
        ipcRenderer.on('history-autocomplete-keyboard', (event, action) => {
            if (!selectedItems.length) return;
            
            switch (action) {
                case 'down':
                    if (selectedIndex < selectedItems.length - 1) {
                        selectItem(selectedIndex + 1);
                    } else {
                        selectItem(0);
                    }
                    break;
                case 'up':
                    if (selectedIndex > 0) {
                        selectItem(selectedIndex - 1);
                    } else {
                        selectItem(selectedItems.length - 1);
                    }
                    break;
                case 'enter':
                    if (selectedIndex >= 0 && selectedIndex < selectedItems.length) {
                        const selectedItem = selectedItems[selectedIndex];
                        ipcRenderer.invoke('history-autocomplete-selected', selectedItem);
                    }
                    break;
                case 'escape':
                    //清空并隐藏
                    ipcRenderer.invoke('history-autocomplete-hide');
                    break;
            }
        });
        
        //初始化
        console.log('历史记录自动匹配页面已加载');
    </script>
</body>
</html>
